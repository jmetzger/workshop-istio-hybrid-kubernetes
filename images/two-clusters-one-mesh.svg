<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker>
  </defs>
  <rect width="1200" height="920" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Your lab: two clusters, one mesh. How cluster b answers a request with pods from cluster a</text>

  <!-- Jump-Host -->
  <rect x="380" y="55" width="440" height="78" rx="8" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="2"/>
  <text x="600" y="80" text-anchor="middle" font-weight="bold" fill="#1d3b66">Jump host: you work here</text>
  <text x="600" y="102" text-anchor="middle" fill="#1d3b66">kubectl, istioctl 1.29.9, ssh a-cp / b-cp ...</text>
  <text x="600" y="121" text-anchor="middle" fill="#1d3b66">server-overview.md lists all servers</text>
  <path d="M480,133 L300,188" stroke="#555" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#pf)"/>
  <path d="M720,133 L900,188" stroke="#555" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#pf)"/>
  <text x="600" y="162" text-anchor="middle" fill="#555" font-size="13">over IPv6 (ports 22 and 6443)</text>

  <!-- Cluster a -->
  <rect x="40" y="190" width="520" height="420" rx="10" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="60" y="216" font-weight="bold" font-size="16" fill="#1f5f1f">Cluster a (context cluster-a)</text>
  <rect x="60" y="235" width="230" height="70" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="175" y="262" text-anchor="middle" font-weight="bold">Worker</text>
  <text x="175" y="284" text-anchor="middle" fill="#555">Kubernetes node</text>
  <rect x="310" y="235" width="230" height="70" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="425" y="258" text-anchor="middle" font-weight="bold">Control-Plane + istiod</text>
  <text x="425" y="280" text-anchor="middle" fill="#555">Istio 1.29.9, sidecar mode</text>
  <circle cx="525" cy="250" r="11" fill="#555"/><text x="525" y="255" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
  <rect x="60" y="340" width="140" height="50" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="130" y="358" text-anchor="middle" font-weight="bold" font-size="12">istio-ingressgateway</text>
  <text x="130" y="377" text-anchor="middle" fill="#555" font-size="11">ns istio-ingress</text>
  <rect x="220" y="340" width="150" height="50" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="295" y="361" text-anchor="middle" font-weight="bold">productpage</text>
  <text x="295" y="379" text-anchor="middle" fill="#555" font-size="12">Pod + Sidecar</text>
  <rect x="390" y="340" width="150" height="50" rx="6" fill="#fff4e0" stroke="#d9730d" stroke-width="2.5"/>
  <text x="465" y="361" text-anchor="middle" font-weight="bold">reviews</text>
  <text x="465" y="379" text-anchor="middle" fill="#555" font-size="12">3 pods run here</text>
  <circle cx="525" cy="352" r="11" fill="#555"/><text x="525" y="357" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
  <rect x="60" y="520" width="230" height="62" rx="6" fill="#fafafa" stroke="#888" stroke-dasharray="6 4"/>
  <text x="175" y="545" text-anchor="middle" font-weight="bold">VM (Ubuntu, IPv6 only)</text>
  <text x="175" y="565" text-anchor="middle" fill="#555" font-size="12">not in the mesh yet, exercise</text>

  <!-- Cluster b -->
  <rect x="640" y="190" width="520" height="420" rx="10" fill="#f7f3fb" stroke="#7a4fb0" stroke-width="2"/>
  <text x="660" y="216" font-weight="bold" font-size="16" fill="#4b2a78">Cluster b (context cluster-b)</text>
  <rect x="660" y="235" width="230" height="70" rx="6" fill="#fff" stroke="#7a4fb0"/>
  <text x="775" y="258" text-anchor="middle" font-weight="bold">Control-Plane + istiod</text>
  <text x="775" y="280" text-anchor="middle" fill="#555">Istio 1.29.9, sidecar mode</text>
  <circle cx="675" cy="250" r="11" fill="#555"/><text x="675" y="255" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
  <rect x="910" y="235" width="230" height="70" rx="6" fill="#fff" stroke="#7a4fb0"/>
  <text x="1025" y="262" text-anchor="middle" font-weight="bold">Worker</text>
  <text x="1025" y="284" text-anchor="middle" fill="#555">Kubernetes node</text>
  <rect x="660" y="340" width="140" height="50" rx="6" fill="#fff" stroke="#d9730d" stroke-width="2.5"/>
  <text x="730" y="358" text-anchor="middle" font-weight="bold" font-size="12">istio-ingressgateway</text>
  <text x="730" y="377" text-anchor="middle" fill="#555" font-size="11">ns istio-ingress</text>
  <rect x="830" y="340" width="140" height="50" rx="6" fill="#fff" stroke="#d9730d" stroke-width="2.5"/>
  <text x="900" y="361" text-anchor="middle" font-weight="bold">productpage</text>
  <text x="900" y="379" text-anchor="middle" fill="#555" font-size="12">Pod + Sidecar</text>
  <rect x="1000" y="340" width="140" height="50" rx="6" fill="#f2f2f2" stroke="#999" stroke-dasharray="6 4"/>
  <text x="1070" y="361" text-anchor="middle" font-weight="bold" fill="#777">reviews</text>
  <text x="1070" y="379" text-anchor="middle" fill="#777" font-size="12">service exists, 0 pods</text>
  <circle cx="1125" cy="352" r="11" fill="#555"/><text x="1125" y="357" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
  <rect x="910" y="520" width="230" height="62" rx="6" fill="#fafafa" stroke="#888" stroke-dasharray="6 4"/>
  <text x="1025" y="545" text-anchor="middle" font-weight="bold">VM (Ubuntu, IPv6 only)</text>
  <text x="1025" y="565" text-anchor="middle" fill="#555" font-size="12">not in the mesh yet, exercise</text>

  <!-- 2: Remote-Secret zwischen den istiods -->
  <path d="M542,270 L658,270" stroke="#555" stroke-width="2" fill="none" marker-start="url(#pf)" marker-end="url(#pf)"/>
  <circle cx="600" cy="252" r="11" fill="#555"/><text x="600" y="257" text-anchor="middle" fill="#fff" font-weight="bold">2</text>

  <!-- Weg der Anfrage (orange) -->
  <rect x="660" y="645" width="200" height="48" rx="6" fill="#fff4e0" stroke="#d9730d" stroke-width="2"/>
  <text x="760" y="666" text-anchor="middle" font-weight="bold" fill="#8a4500">Request from outside</text>
  <text x="760" y="684" text-anchor="middle" fill="#8a4500" font-size="12">e.g. curl to the gateway address</text>
  <path d="M730,645 L730,393" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <circle cx="712" cy="560" r="12" fill="#d9730d"/><text x="712" y="565" text-anchor="middle" fill="#fff" font-weight="bold">A</text>
  <path d="M802,365 L828,365" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <circle cx="815" cy="415" r="12" fill="#d9730d"/><text x="815" y="420" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
  <path d="M900,393 L900,470 L465,470 L465,393" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <circle cx="680" cy="470" r="12" fill="#d9730d"/><text x="680" y="475" text-anchor="middle" fill="#fff" font-weight="bold">C</text>
  <circle cx="600" cy="470" r="11" fill="#555"/><text x="600" y="475" text-anchor="middle" fill="#fff" font-weight="bold">3</text>

  <!-- Legende -->
  <rect x="40" y="715" width="1120" height="190" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="56" y="740" font-weight="bold" fill="#8a4500">The path of a request (orange)</text>
  <text x="56" y="762" fill="#333"><tspan font-weight="bold">A</tspan>  The request arrives at the istio-ingressgateway of cluster b.</text>
  <text x="56" y="782" fill="#333"><tspan font-weight="bold">B</tspan>  The istio-ingressgateway passes it to productpage in cluster b.</text>
  <text x="56" y="802" fill="#333"><tspan font-weight="bold">C</tspan>  productpage calls reviews. No reviews pod runs in cluster b, so the pods in cluster a answer.</text>
  <text x="56" y="832" font-weight="bold" fill="#333">What it takes (grey numbers in the picture)</text>
  <text x="56" y="854" fill="#333"><tspan font-weight="bold">1</tspan>  Same root CA: each side trusts the certificates of the other.    <tspan font-weight="bold">2</tspan>  Remote secret: istiod reads the API of the other cluster.</text>
  <text x="56" y="874" fill="#333"><tspan font-weight="bold">3</tspan>  Pods reach each other directly (IPv6, Calico without overlay, the firewall allows only your lab).</text>
  <text x="56" y="894" fill="#333"><tspan font-weight="bold">4</tspan>  The service reviews exists in both clusters (same name and namespace). The pods only in one, in b the deployment may be at 0.</text>
</svg>
