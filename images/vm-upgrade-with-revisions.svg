<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">A VM moves to the new istiod with its restart, not with the selector</text>

  <rect x="40" y="55" width="350" height="400" rx="10" fill="#f7f7f7" stroke="#999" stroke-width="2"/>
  <text x="60" y="82" font-weight="bold" font-size="16" fill="#333">Step 2: two istiod</text>
  <rect x="65" y="100" width="300" height="56" rx="6" fill="#fff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="215" y="124" text-anchor="middle" font-weight="bold" fill="#1a5fb4">VM a-vm1</text>
  <text x="215" y="144" text-anchor="middle" fill="#222">sidecar 1.29.9</text>
  <rect x="65" y="195" width="300" height="66" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="215" y="219" text-anchor="middle" font-weight="bold">Service istiod-lb</text>
  <text x="215" y="241" text-anchor="middle" fill="#555" font-size="12">selector: app=istiod, istio=pilot</text>
  <rect x="65" y="310" width="140" height="62" rx="6" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="135" y="334" text-anchor="middle" font-weight="bold" fill="#1f5f1f">istiod 1.29.9</text>
  <text x="135" y="354" text-anchor="middle" fill="#555" font-size="12">default (old)</text>
  <rect x="225" y="310" width="140" height="62" rx="6" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="295" y="334" text-anchor="middle" font-weight="bold" fill="#1f5f1f">istiod 1.30.8</text>
  <text x="295" y="354" text-anchor="middle" fill="#555" font-size="12">revision 1-30-8 (new)</text>
  <path d="M215,158 L215,193" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <path d="M150,263 L135,308" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <path d="M280,263 L295,308" stroke="#888" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#pg)"/>
  <text x="215" y="397" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">A VM that connects now could</text>
  <text x="215" y="415" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">land on either istiod.</text>
  <rect x="425" y="55" width="350" height="400" rx="10" fill="#f7f7f7" stroke="#999" stroke-width="2"/>
  <text x="445" y="82" font-weight="bold" font-size="16" fill="#333">Step 3: switch the selector</text>
  <rect x="450" y="100" width="300" height="56" rx="6" fill="#fff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="600" y="124" text-anchor="middle" font-weight="bold" fill="#1a5fb4">VM a-vm1</text>
  <text x="600" y="144" text-anchor="middle" fill="#222">sidecar 1.29.9</text>
  <rect x="450" y="195" width="300" height="66" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="600" y="219" text-anchor="middle" font-weight="bold">Service istiod-lb</text>
  <text x="600" y="241" text-anchor="middle" fill="#555" font-size="12">selector: app=istiod, istio.io/rev=1-30-8</text>
  <rect x="450" y="310" width="140" height="62" rx="6" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="520" y="334" text-anchor="middle" font-weight="bold" fill="#1f5f1f">istiod 1.29.9</text>
  <text x="520" y="354" text-anchor="middle" fill="#555" font-size="12">default (old)</text>
  <rect x="610" y="310" width="140" height="62" rx="6" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="680" y="334" text-anchor="middle" font-weight="bold" fill="#1f5f1f">istiod 1.30.8</text>
  <text x="680" y="354" text-anchor="middle" fill="#555" font-size="12">revision 1-30-8 (new)</text>
  <path d="M600,158 L600,193" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <path d="M535,263 L520,308" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <path d="M665,263 L680,308" stroke="#888" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#pg)"/>
  <text x="600" y="397" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">Only the new istiod answers new connections.</text>
  <text x="600" y="418" text-anchor="middle" fill="#555" font-size="12">The VM does not move: its open connection</text>
  <text x="600" y="435" text-anchor="middle" fill="#555" font-size="12">stays on the old istiod.</text>
  <rect x="810" y="55" width="350" height="400" rx="10" fill="#f7f7f7" stroke="#999" stroke-width="2"/>
  <text x="830" y="82" font-weight="bold" font-size="16" fill="#333">Step 4: restart the VM</text>
  <rect x="835" y="100" width="300" height="56" rx="6" fill="#dbe8f7" stroke="#d9730d" stroke-width="3"/>
  <text x="985" y="124" text-anchor="middle" font-weight="bold" fill="#1a5fb4">VM a-vm1</text>
  <text x="985" y="144" text-anchor="middle" fill="#222" font-weight="bold">sidecar 1.30.8</text>
  <rect x="835" y="195" width="300" height="66" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="985" y="219" text-anchor="middle" font-weight="bold">Service istiod-lb</text>
  <text x="985" y="241" text-anchor="middle" fill="#555" font-size="12">selector: app=istiod, istio.io/rev=1-30-8</text>
  <rect x="835" y="310" width="140" height="62" rx="6" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="905" y="334" text-anchor="middle" font-weight="bold" fill="#1f5f1f">istiod 1.29.9</text>
  <text x="905" y="354" text-anchor="middle" fill="#555" font-size="12">default (old)</text>
  <rect x="995" y="310" width="140" height="62" rx="6" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="1065" y="334" text-anchor="middle" font-weight="bold" fill="#1f5f1f">istiod 1.30.8</text>
  <text x="1065" y="354" text-anchor="middle" fill="#555" font-size="12">revision 1-30-8 (new)</text>
  <path d="M985,158 L985,193" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <path d="M920,263 L905,308" stroke="#888" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#pg)"/>
  <path d="M1050,263 L1065,308" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <text x="985" y="397" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">The VM connects again, now to the new istiod.</text>
  <text x="985" y="418" text-anchor="middle" fill="#555" font-size="12">proxy-status --revision 1-30-8 shows it.</text>
  <path d="M392,255 L422,255" stroke="#555" stroke-width="2" fill="none" marker-end="url(#pg)"/>
  <path d="M777,255 L807,255" stroke="#555" stroke-width="2" fill="none" marker-end="url(#pg)"/>

  <rect x="40" y="485" width="1110" height="56" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="595" y="509" text-anchor="middle" font-weight="bold" fill="#1f5f1f">Then (step 5): move the pods, set the tag default, remove the old istiod</text>
  <text x="595" y="529" text-anchor="middle" fill="#555" font-size="13">The VM does not notice: it uses the address of istiod-lb, not the Service istiod that goes away.</text>
  <path d="M40,580 L80,580" stroke="#d9730d" stroke-width="3" marker-end="url(#po)"/>
  <text x="90" y="585" font-size="12" fill="#555">connection of the VM</text>
  <path d="M250,580 L290,580" stroke="#888" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pg)"/>
  <text x="300" y="585" font-size="12" fill="#555">a new connection could go here</text>
  <text x="40" y="615" font-size="12" fill="#555">The restart of the sidecar costs the same gap as in place: 6 calls with 503 in our lab, with one VM.</text>
</svg>
