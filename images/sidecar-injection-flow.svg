<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a6fa5"/></marker>
    <marker id="io" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker>
    <marker id="ig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">How the sidecar gets into the pod: automatic injection</text>
  <rect x="40" y="70" width="290" height="120" rx="8" fill="#fff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="185.0" y="96" text-anchor="middle" font-weight="bold">You</text>
  <text x="185.0" y="120" text-anchor="middle" fill="#555" font-size="12.5">kubectl apply: a Deployment in a</text>
  <text x="185.0" y="138" text-anchor="middle" fill="#555" font-size="12.5">namespace with the label</text>
  <text x="185.0" y="156" text-anchor="middle" fill="#555" font-size="12.5">istio-injection=enabled</text>
  <rect x="430" y="70" width="300" height="120" rx="8" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="580.0" y="96" text-anchor="middle" font-weight="bold">kube-apiserver</text>
  <text x="580.0" y="120" text-anchor="middle" fill="#555" font-size="12.5">creates the Pod. Before it stores the Pod,</text>
  <text x="580.0" y="138" text-anchor="middle" fill="#555" font-size="12.5">the admission step calls the mutating</text>
  <text x="580.0" y="156" text-anchor="middle" fill="#555" font-size="12.5">webhook istio-sidecar-injector</text>
  <rect x="840" y="70" width="320" height="120" rx="8" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="1000.0" y="96" text-anchor="middle" font-weight="bold">istiod</text>
  <text x="1000.0" y="120" text-anchor="middle" fill="#555" font-size="12.5">answers the webhook: Service istiod, port 443,</text>
  <text x="1000.0" y="138" text-anchor="middle" fill="#555" font-size="12.5">path /inject (container port 15017).</text>
  <text x="1000.0" y="156" text-anchor="middle" fill="#555" font-size="12.5">It works out what to add from the template</text>
  <path d="M332,130 L428,130" stroke="#4a6fa5" stroke-width="3" fill="none" marker-end="url(#ib)"/>
  <path d="M732,108 L838,108" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#io)"/>
  <text x="785" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a4500">Pod spec</text>
  <path d="M838,160 L734,160" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#io)"/>
  <text x="785" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a4500">patch</text>
  <circle cx="380" cy="112" r="13" fill="#4a6fa5"/><text x="380" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
  <circle cx="785" cy="64" r="13" fill="#d9730d"/><text x="785" y="69" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
  <circle cx="785" cy="198" r="13" fill="#d9730d"/><text x="785" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
  <path d="M580,192 L580,262" stroke="#4a6fa5" stroke-width="3" fill="none" marker-end="url(#ib)"/>
  <text x="596" y="232" font-size="11.5" font-weight="bold" fill="#1d3b66">applies the patch</text>
  <circle cx="560" cy="226" r="13" fill="#4a6fa5"/><text x="560" y="231" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
  <rect x="40" y="264" width="700" height="150" rx="8" fill="#eef4fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="390" y="288" text-anchor="middle" font-weight="bold">The Pod as it is stored and started (here: 2/2 containers ready)</text>
  <rect x="60" y="304" width="190" height="90" rx="6" fill="#fff" stroke="#4a6fa5" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="155" y="328" text-anchor="middle" font-weight="bold" font-size="13">istio-init</text>
  <text x="155" y="348" text-anchor="middle" fill="#555" font-size="12">init container, added</text>
  <text x="155" y="364" text-anchor="middle" fill="#555" font-size="12">runs first, sets the</text>
  <text x="155" y="380" text-anchor="middle" fill="#555" font-size="12">iptables rules</text>
  <rect x="270" y="304" width="230" height="90" rx="6" fill="#1a5fb4" stroke="#0e3d7a" stroke-width="2"/>
  <text x="385" y="328" text-anchor="middle" font-weight="bold" font-size="13" fill="#fff">istio-proxy</text>
  <text x="385" y="348" text-anchor="middle" fill="#dbe8fb" font-size="12">native sidecar, added</text>
  <text x="385" y="364" text-anchor="middle" fill="#dbe8fb" font-size="12">pilot-agent and Envoy,</text>
  <text x="385" y="380" text-anchor="middle" fill="#dbe8fb" font-size="12">runs next to the application</text>
  <rect x="520" y="304" width="200" height="90" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="620" y="328" text-anchor="middle" font-weight="bold" font-size="13" fill="#0b5247">your application</text>
  <text x="620" y="348" text-anchor="middle" fill="#0b5247" font-size="12">unchanged, as you</text>
  <text x="620" y="364" text-anchor="middle" fill="#0b5247" font-size="12">wrote it in the Deployment</text>
  <path d="M742,340 L838,340" stroke="#4a6fa5" stroke-width="3" fill="none" marker-end="url(#ib)"/>
  <rect x="840" y="264" width="320" height="150" rx="8" fill="#fff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="1000.0" y="290" text-anchor="middle" font-weight="bold">kubelet starts the Pod</text>
  <text x="1000.0" y="314" text-anchor="middle" fill="#555" font-size="12.5">first istio-init (iptables),</text>
  <text x="1000.0" y="332" text-anchor="middle" fill="#555" font-size="12.5">then istio-proxy: the pilot-agent connects</text>
  <text x="1000.0" y="350" text-anchor="middle" fill="#555" font-size="12.5">to istiod on 15012 and gets configuration</text>
  <text x="1000.0" y="368" text-anchor="middle" fill="#555" font-size="12.5">and certificate. Then your application.</text>
  <circle cx="790" cy="334" r="13" fill="#4a6fa5"/><text x="790" y="339" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text>

  <rect x="40" y="436" width="1120" height="104" rx="8" fill="#fafafa" stroke="#bbb"/>
  <text x="56" y="460" font-size="13" fill="#333"><tspan font-weight="bold">When:</tspan> only when a Pod is created. Pods that are already running are not changed: delete them, and the Deployment creates new ones with the sidecar.</text>
  <text x="56" y="482" font-size="13" fill="#333"><tspan font-weight="bold">Which pods:</tspan> pods in a namespace with the label istio-injection=enabled, unless the pod has the label sidecar.istio.io/inject=false.</text>
  <text x="56" y="504" font-size="13" fill="#333"><tspan font-weight="bold">What to add:</tspan> istiod takes the template from the ConfigMap istio-sidecar-injector in istio-system.</text>
  <text x="56" y="526" font-size="13" fill="#8a4500"><tspan font-weight="bold">If istiod is down:</tspan> the webhook has failurePolicy Fail, so new pods in labelled namespaces are rejected until istiod answers again.</text>
</svg>
