<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a5fb4"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Two flows: configuration reaches the proxies, then a request uses it</text>

  <!-- Flow 1 -->
  <rect x="30" y="55" width="1140" height="215" rx="10" fill="#f3f8ff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="50" y="82" font-weight="bold" font-size="16" fill="#1d3b66">Flow 1: from an administrator to the proxies</text>

  <rect x="60" y="120" width="190" height="80" rx="6" fill="#fff" stroke="#999" stroke-width="2"/>
  <text x="155" y="150" text-anchor="middle" font-weight="bold" fill="#333">Admin / DevOps</text>
  <text x="155" y="172" text-anchor="middle" fill="#555" font-size="12">kubectl apply</text>
  <text x="155" y="188" text-anchor="middle" fill="#555" font-size="12">VirtualService</text>
  <path d="M252,160 L338,160" stroke="#1a5fb4" stroke-width="3" fill="none" marker-end="url(#ab)"/>
  <circle cx="295" cy="136" r="12" fill="#1a5fb4"/><text x="295" y="141" text-anchor="middle" fill="#fff" font-weight="bold">1</text>

  <rect x="340" y="120" width="190" height="80" rx="6" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="435" y="150" text-anchor="middle" font-weight="bold" fill="#333">Kubernetes API</text>
  <text x="435" y="172" text-anchor="middle" fill="#555" font-size="12">stores the object</text>
  <path d="M532,160 L618,160" stroke="#1a5fb4" stroke-width="3" fill="none" marker-end="url(#ab)"/>
  <circle cx="575" cy="136" r="12" fill="#1a5fb4"/><text x="575" y="141" text-anchor="middle" fill="#fff" font-weight="bold">2</text>

  <rect x="620" y="110" width="220" height="100" rx="8" fill="#1a5fb4" stroke="#0e3d7a" stroke-width="2"/>
  <text x="730" y="142" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">istiod</text>
  <text x="730" y="166" text-anchor="middle" fill="#dbe8fb" font-size="12">validates the configuration,</text>
  <text x="730" y="184" text-anchor="middle" fill="#dbe8fb" font-size="12">translates it into Envoy configuration</text>

  <path d="M842,135 L938,120" stroke="#1a5fb4" stroke-width="3" fill="none" marker-end="url(#ab)"/>
  <path d="M842,185 L938,200" stroke="#1a5fb4" stroke-width="3" fill="none" marker-end="url(#ab)"/>
  <circle cx="890" cy="98" r="12" fill="#1a5fb4"/><text x="890" y="103" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
  <rect x="940" y="95" width="200" height="50" rx="6" fill="#e8f4f8" stroke="#1a5fb4" stroke-width="2"/>
  <text x="1040" y="116" text-anchor="middle" font-weight="bold" fill="#0e3d7a">Envoy of Service A</text>
  <text x="1040" y="134" text-anchor="middle" fill="#0e3d7a" font-size="12">applies the new rules</text>
  <rect x="940" y="175" width="200" height="50" rx="6" fill="#e8f4f8" stroke="#1a5fb4" stroke-width="2"/>
  <text x="1040" y="196" text-anchor="middle" font-weight="bold" fill="#0e3d7a">Envoy of Service B</text>
  <text x="1040" y="214" text-anchor="middle" fill="#0e3d7a" font-size="12">applies the new rules</text>
  <text x="600" y="252" text-anchor="middle" fill="#1d3b66" font-size="13">Step 3 is a push over the open xDS connection. Nobody restarts a pod and nobody edits a proxy by hand.</text>

  <!-- Flow 2 -->
  <rect x="30" y="300" width="1140" height="270" rx="10" fill="#fff9f0" stroke="#d9730d" stroke-width="2"/>
  <text x="50" y="327" font-weight="bold" font-size="16" fill="#8a4500">Flow 2: one request from Service A to Service B</text>

  <rect x="60" y="380" width="150" height="70" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="135" y="420" text-anchor="middle" font-weight="bold" fill="#0b5247">Service A</text>
  <path d="M212,415 L268,415" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#ao)"/>
  <circle cx="240" cy="392" r="12" fill="#d9730d"/><text x="240" y="397" text-anchor="middle" fill="#fff" font-weight="bold">1</text>

  <rect x="270" y="360" width="210" height="110" rx="6" fill="#e8f4f8" stroke="#1a5fb4" stroke-width="2"/>
  <text x="375" y="388" text-anchor="middle" font-weight="bold" fill="#0e3d7a">Envoy of Service A</text>
  <text x="375" y="412" text-anchor="middle" fill="#0e3d7a" font-size="12">outbound request is caught</text>
  <text x="375" y="430" text-anchor="middle" fill="#0e3d7a" font-size="12">load balancing, retries,</text>
  <text x="375" y="448" text-anchor="middle" fill="#0e3d7a" font-size="12">timeouts</text>
  <path d="M482,415 L598,415" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#ao)"/>
  <circle cx="540" cy="392" r="12" fill="#d9730d"/><text x="540" y="397" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
  <text x="540" y="440" text-anchor="middle" fill="#1a5fb4" font-weight="bold" font-size="13">mTLS</text>

  <rect x="600" y="360" width="210" height="110" rx="6" fill="#e8f4f8" stroke="#1a5fb4" stroke-width="2"/>
  <text x="705" y="388" text-anchor="middle" font-weight="bold" fill="#0e3d7a">Envoy of Service B</text>
  <text x="705" y="412" text-anchor="middle" fill="#0e3d7a" font-size="12">checks the caller identity</text>
  <text x="705" y="430" text-anchor="middle" fill="#0e3d7a" font-size="12">and the policy, then passes</text>
  <text x="705" y="448" text-anchor="middle" fill="#0e3d7a" font-size="12">the request on</text>
  <path d="M812,415 L868,415" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#ao)"/>
  <circle cx="840" cy="392" r="12" fill="#d9730d"/><text x="840" y="397" text-anchor="middle" fill="#fff" font-weight="bold">3</text>

  <rect x="870" y="380" width="150" height="70" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="945" y="420" text-anchor="middle" font-weight="bold" fill="#0b5247">Service B</text>
  <text x="1090" y="400" text-anchor="middle" fill="#555" font-size="12">The response</text>
  <text x="1090" y="418" text-anchor="middle" fill="#555" font-size="12">takes the same</text>
  <text x="1090" y="436" text-anchor="middle" fill="#555" font-size="12">way back.</text>

  <text x="600" y="520" text-anchor="middle" fill="#8a4500" font-size="13">Both Envoys report metrics (requests, errors, latency) that Prometheus scrapes. The application does not have to write any of it.</text>
  <text x="600" y="546" text-anchor="middle" fill="#555" font-size="12">Seen from the application, Service A just calls Service B. The detour through the two proxies is transparent.</text>
</svg>
