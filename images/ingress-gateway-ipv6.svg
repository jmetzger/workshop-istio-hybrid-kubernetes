<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker>
  </defs>
  <rect width="1200" height="770" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Bookinfo through the ingress gateway over IPv6: the way of a request</text>

  <!-- Callers -->
  <rect x="40" y="60" width="330" height="100" rx="8" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="2"/>
  <text x="205" y="86" text-anchor="middle" font-weight="bold" fill="#1d3b66">Callers with IPv6</text>
  <text x="205" y="108" text-anchor="middle" fill="#1d3b66" font-size="13">a host outside the lab (curl -6, browser),</text>
  <text x="205" y="126" text-anchor="middle" fill="#1d3b66" font-size="13">a node of the other cluster</text>
  <text x="205" y="148" text-anchor="middle" fill="#555" font-size="12">http://[2a01:...::2:1]/productpage</text>

  <!-- Firewall -->
  <rect x="470" y="60" width="330" height="100" rx="8" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="635" y="86" text-anchor="middle" font-weight="bold" fill="#333">Cloud firewall of the provider</text>
  <text x="635" y="108" text-anchor="middle" fill="#555" font-size="13">allows TCP 80 and 443 from the internet</text>
  <text x="635" y="126" text-anchor="middle" fill="#555" font-size="13">SSH, API server, kubelet stay closed</text>

  <path d="M372,110 L468,110" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <circle cx="420" cy="92" r="12" fill="#d9730d"/><text x="420" y="97" text-anchor="middle" fill="#fff" font-weight="bold">1</text>

  <!-- Cluster -->
  <rect x="40" y="200" width="1120" height="420" rx="10" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="60" y="226" font-weight="bold" font-size="16" fill="#1f5f1f">Cluster A (IPv6 single stack)</text>

  <path d="M635,162 L635,222 L300,222 L300,238" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <circle cx="635" cy="195" r="12" fill="#d9730d"/><text x="635" y="200" text-anchor="middle" fill="#fff" font-weight="bold">2</text>

  <!-- Node with the /64 -->
  <rect x="60" y="240" width="270" height="130" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="195" y="264" text-anchor="middle" font-weight="bold">Node that owns the /64</text>
  <text x="195" y="284" text-anchor="middle" fill="#555" font-size="12">(here the control-plane node)</text>
  <text x="195" y="306" text-anchor="middle" fill="#555" font-size="12">the provider routes a whole /64 to it;</text>
  <text x="195" y="322" text-anchor="middle" fill="#555" font-size="12">the fixed address ...::2:1 lies in this /64</text>
  <rect x="75" y="334" width="240" height="26" rx="5" fill="#fff4e0" stroke="#d9730d" stroke-width="2"/>
  <text x="195" y="352" text-anchor="middle" fill="#8a4500" font-size="12" font-weight="bold">MetalLB speaker answers for ...::2:1</text>

  <!-- MetalLB namespace -->
  <rect x="60" y="390" width="270" height="170" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="195" y="414" text-anchor="middle" font-weight="bold">Namespace metallb-system</text>
  <text x="195" y="438" text-anchor="middle" font-weight="bold" fill="#8a4500" font-size="13">controller</text>
  <text x="195" y="455" text-anchor="middle" fill="#555" font-size="12">gives the address to the Service</text>
  <text x="195" y="471" text-anchor="middle" fill="#555" font-size="12">(runs on a worker in our lab)</text>
  <text x="195" y="496" text-anchor="middle" font-weight="bold" fill="#8a4500" font-size="13">speaker (on every node)</text>
  <text x="195" y="513" text-anchor="middle" fill="#555" font-size="12">only the speaker of the /64 node announces</text>
  <text x="195" y="529" text-anchor="middle" fill="#555" font-size="12">the address (L2Advertisement with nodeSelector)</text>
  <text x="195" y="548" text-anchor="middle" fill="#555" font-size="12">no floating IP, no cloud load balancer</text>

  <!-- istio-ingress -->
  <rect x="370" y="240" width="330" height="340" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="535" y="264" text-anchor="middle" font-weight="bold">Namespace istio-ingress</text>
  <rect x="385" y="280" width="300" height="120" rx="6" fill="#fff4e0" stroke="#d9730d" stroke-width="2"/>
  <text x="535" y="304" text-anchor="middle" font-weight="bold" fill="#8a4500">Service istio-ingressgateway</text>
  <text x="535" y="324" text-anchor="middle" fill="#555" font-size="12">LoadBalancer, SingleStack IPv6</text>
  <text x="440" y="348" text-anchor="middle" fill="#333" font-size="13">80 → 8080</text><text x="535" y="348" text-anchor="middle" fill="#333" font-size="13">443 → 8443</text><text x="630" y="348" text-anchor="middle" fill="#333" font-size="13">15021 → 15021</text>
  <text x="535" y="372" text-anchor="middle" fill="#555" font-size="12">port 80 leads to port 8080 of the pod</text>
  <text x="535" y="388" text-anchor="middle" fill="#555" font-size="12">(the pod does not run as root)</text>
  <rect x="385" y="430" width="300" height="130" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="535" y="454" text-anchor="middle" font-weight="bold">Pod istio-ingressgateway (Envoy)</text>
  <text x="535" y="478" text-anchor="middle" fill="#333" font-size="13">listens on [::]:8080  (IPv6 only), runs on any node</text>
  <text x="535" y="502" text-anchor="middle" fill="#555" font-size="12">gets its routes from istiod, built from the</text>
  <text x="535" y="518" text-anchor="middle" fill="#555" font-size="12">Gateway and the VirtualService (namespace default)</text>
  <path d="M535,402 L535,428" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <circle cx="560" cy="414" r="12" fill="#d9730d"/><text x="560" y="419" text-anchor="middle" fill="#fff" font-weight="bold">4</text>

  <!-- node -> service -->
  <path d="M332,347 L383,347" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <circle cx="357" cy="329" r="12" fill="#d9730d"/><text x="357" y="334" text-anchor="middle" fill="#fff" font-weight="bold">3</text>

  <!-- default namespace -->
  <rect x="740" y="240" width="400" height="340" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="940" y="264" text-anchor="middle" font-weight="bold">Namespace default (sidecar injection on)</text>
  <rect x="755" y="280" width="370" height="90" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="940" y="304" text-anchor="middle" font-weight="bold" fill="#555">Gateway bookinfo-gateway + VirtualService bookinfo</text>
  <text x="940" y="326" text-anchor="middle" fill="#555" font-size="12">port 8080 (the port of the pod), host *, routes</text>
  <text x="940" y="344" text-anchor="middle" fill="#555" font-size="12">/productpage, /static, /login, /logout, /api/v1/products</text>
  <text x="940" y="362" text-anchor="middle" fill="#555" font-size="12">(only configuration, no traffic runs through it)</text>
  <rect x="755" y="395" width="370" height="55" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="940" y="419" text-anchor="middle" font-weight="bold">productpage</text>
  <text x="940" y="437" text-anchor="middle" fill="#555" font-size="12">pod with sidecar (2/2), port 9080</text>
  <rect x="755" y="480" width="110" height="50" rx="6" fill="#fff" stroke="#3b8a3b"/><text x="810" y="510" text-anchor="middle">details</text>
  <rect x="885" y="480" width="110" height="50" rx="6" fill="#fff" stroke="#3b8a3b"/><text x="940" y="503" text-anchor="middle">reviews</text><text x="940" y="520" text-anchor="middle" fill="#555" font-size="11">v1, v2, v3</text>
  <rect x="1015" y="480" width="110" height="50" rx="6" fill="#fff" stroke="#3b8a3b"/><text x="1070" y="510" text-anchor="middle">ratings</text>
  <path d="M940,452 L810,478" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#pg)"/>
  <path d="M940,452 L940,478" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#pg)"/>
  <path d="M995,505 L1013,505" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#pg)"/>

  <!-- gateway pod -> productpage -->
  <path d="M687,495 L728,495 L728,422 L753,422" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <circle cx="728" cy="460" r="12" fill="#d9730d"/><text x="728" y="465" text-anchor="middle" fill="#fff" font-weight="bold">5</text>
  <!-- config -> gateway -->
  <path d="M755,350 L710,350 L710,540 L687,540" stroke="#999" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#pg)"/>

  <!-- legend -->
  <rect x="40" y="640" width="1120" height="115" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="56" y="664" fill="#333"><tspan font-weight="bold" fill="#8a4500">1, 2</tspan>  The caller needs only IPv6 and the fixed address of the gateway. The firewall lets TCP 80 and 443 in.</text>
  <text x="56" y="684" fill="#333"><tspan font-weight="bold" fill="#8a4500">3</tspan>  The address lies in the /64 of one node. Only the MetalLB speaker of that node announces it, the traffic arrives there and goes on to the gateway pod (80 becomes 8080).</text>
  <text x="56" y="704" fill="#333"><tspan font-weight="bold" fill="#8a4500">4, 5</tspan>  Envoy in the gateway pod picks the route from the Gateway and the VirtualService and passes the request to productpage,</text>
  <text x="90" y="722" fill="#333">which calls details and reviews (reviews calls ratings).</text>
  <text x="56" y="742" fill="#555" font-size="13">Limit: if the node with the /64 is down, the address is gone, even if the gateway pod runs on another node. Dashed grey line: configuration (through istiod), not traffic.</text>
</svg>
