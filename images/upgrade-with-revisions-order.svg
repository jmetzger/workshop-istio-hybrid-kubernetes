<text x="943" y="281" fill="#1a5fb4">reviews</text><text x="1147" y="281" text-anchor="end" fill="#222" font-weight="bold">sidecar 1.30.8</text>
<text x="1045" y="365" text-anchor="middle" fill="#555" font-size="12">tag default points to 1-30-8</text>
<rect x="30" y="396" width="260" height="104" rx="6" fill="#fff" stroke="#d9730d" stroke-width="1.5"/>
<text x="42" y="416" font-weight="bold" fill="#d9730d" font-size="12">Step 1, 2</text>
<text x="42" y="436" font-weight="bold">Before you start</text>
<text x="42" y="456" fill="#555" font-size="12">precheck, save the Helm values,</text>
<text x="42" y="472" fill="#555" font-size="12">start the loop of calls</text>
<rect x="325" y="396" width="260" height="104" rx="6" fill="#fff" stroke="#d9730d" stroke-width="1.5"/>
<text x="337" y="416" font-weight="bold" fill="#d9730d" font-size="12">Step 3, 4</text>
<text x="337" y="436" font-weight="bold">Second control plane</text>
<text x="337" y="456" fill="#555" font-size="12">istio-csr gets the revision,</text>
<text x="337" y="472" fill="#555" font-size="12">helm install istiod-1-30-8</text>
<text x="337" y="488" fill="#555" font-size="12">next to the old one</text>
<rect x="620" y="396" width="260" height="104" rx="6" fill="#fff" stroke="#d9730d" stroke-width="1.5"/>
<text x="632" y="416" font-weight="bold" fill="#d9730d" font-size="12">Step 5, 6</text>
<text x="632" y="436" font-weight="bold">Move the workloads</text>
<text x="632" y="456" fill="#555" font-size="12">label the namespace istio.io/rev,</text>
<text x="632" y="472" fill="#555" font-size="12">restart the pods, gateway with</text>
<text x="632" y="488" fill="#555" font-size="12">the revision as Helm value</text>
<rect x="915" y="396" width="260" height="104" rx="6" fill="#fff" stroke="#d9730d" stroke-width="1.5"/>
<text x="927" y="416" font-weight="bold" fill="#d9730d" font-size="12">Step 7</text>
<text x="927" y="436" font-weight="bold">Tag and cleanup</text>
<text x="927" y="456" fill="#555" font-size="12">tag default to the new revision,</text>
<text x="927" y="472" fill="#555" font-size="12">then helm delete of the old istiod</text>
<text x="927" y="488" fill="#555" font-size="12">way back: label back, restart</text>
<rect x="30" y="510" width="1140" height="44" rx="6" fill="#f3faf3" stroke="#3b8a3b"/>
<text x="600" y="537" text-anchor="middle" fill="#1f5f1f">A loop calls Bookinfo twice per second the whole time: 182 calls, 2 without an answer (while the pods restarted)</text>
<text x="30" y="582" font-size="12" fill="#555">A workload moves only with its namespace label and a new pod. A second istiod alone changes nothing.</text>
</svg>