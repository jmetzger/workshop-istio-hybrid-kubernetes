<rect x="46" y="256" width="228" height="40" rx="6" fill="#fff" stroke="#4a6fa5" stroke-width="1"/>
<text x="58" y="281" fill="#1a5fb4">reviews</text><text x="262" y="281" text-anchor="end" fill="#222" >sidecar 1.29.9</text>
<text x="160" y="365" text-anchor="middle" fill="#555" font-size="12">everything on the old version</text>
