<text x="648" y="331" fill="#1a5fb4">reviews</text><text x="852" y="331" text-anchor="end" fill="#222" font-weight="bold">sidecar 1.30.8</text>
<text x="750" y="365" text-anchor="middle" fill="#555" font-size="12">new pods are served by the new istiod</text>
<path d="M883,220 L909,220" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
<rect x="915" y="60" width="260" height="320" rx="10" fill="#f7f7f7" stroke="#999" stroke-width="2"/>
<text x="931" y="86" font-weight="bold" font-size="16" fill="#333">Old one removed</text>
<rect x="931" y="100" width="228" height="44" rx="6" fill="#f3faf3" stroke="#d9730d" stroke-width="3"/>
<text x="1045" y="127" text-anchor="middle" font-weight="bold" fill="#1f5f1f">istiod 1-30-8</text>
