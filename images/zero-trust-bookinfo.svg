<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d9730d"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>

  <text x="30" y="34" font-size="22" font-weight="700" fill="#222">Zero trust: deny everything, then allow each path on purpose</text>

  <!-- namespace default -->
  <rect x="440" y="56" width="730" height="400" rx="10" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="458" y="82" font-size="16" font-weight="700" fill="#2b6a2b">namespace default</text>
  <text x="458" y="102" font-size="14" fill="#2b6a2b">deny-all: an empty policy, nothing is allowed</text>

  <!-- namespace istio-ingress -->
  <rect x="200" y="150" width="200" height="150" rx="10" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="214" y="174" font-size="14" font-weight="700" fill="#2b6a2b">namespace istio-ingress</text>

  <!-- caller -->
  <rect x="30" y="200" width="120" height="70" rx="8" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="90" y="231" font-size="16" text-anchor="middle" fill="#222">Browser</text>
  <text x="90" y="252" font-size="13" text-anchor="middle" fill="#555">or curl</text>

  <!-- gateway -->
  <rect x="215" y="190" width="170" height="90" rx="8" fill="#e8eef8" stroke="#4a6fa5" stroke-width="2"/>
  <text x="300" y="218" font-size="16" font-weight="700" text-anchor="middle" fill="#1a5fb4">Ingress gateway</text>
  <text x="300" y="240" font-size="12" text-anchor="middle" fill="#333">identity (service account):</text>
  <text x="300" y="258" font-size="12" text-anchor="middle" fill="#333">istio-ingressgateway</text>

  <!-- productpage -->
  <rect x="470" y="200" width="170" height="70" rx="8" fill="#e8eef8" stroke="#4a6fa5" stroke-width="2"/>
  <text x="555" y="228" font-size="16" font-weight="700" text-anchor="middle" fill="#1a5fb4">productpage</text>
  <text x="555" y="250" font-size="12" text-anchor="middle" fill="#333">bookinfo-productpage</text>

  <!-- details -->
  <rect x="900" y="120" width="210" height="64" rx="8" fill="#e8eef8" stroke="#4a6fa5" stroke-width="2"/>
  <text x="1005" y="148" font-size="16" font-weight="700" text-anchor="middle" fill="#1a5fb4">details</text>
  <text x="1005" y="168" font-size="12" text-anchor="middle" fill="#333">bookinfo-details</text>

  <!-- reviews -->
  <rect x="900" y="236" width="210" height="64" rx="8" fill="#e8eef8" stroke="#4a6fa5" stroke-width="2"/>
  <text x="1005" y="264" font-size="16" font-weight="700" text-anchor="middle" fill="#1a5fb4">reviews</text>
  <text x="1005" y="284" font-size="12" text-anchor="middle" fill="#333">bookinfo-reviews</text>

  <!-- ratings -->
  <rect x="900" y="360" width="210" height="64" rx="8" fill="#e8eef8" stroke="#4a6fa5" stroke-width="2"/>
  <text x="1005" y="388" font-size="16" font-weight="700" text-anchor="middle" fill="#1a5fb4">ratings</text>
  <text x="1005" y="408" font-size="12" text-anchor="middle" fill="#333">bookinfo-ratings</text>

  <!-- plain pod -->
  <rect x="200" y="360" width="190" height="70" rx="8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="295" y="388" font-size="14" font-weight="700" text-anchor="middle" fill="#222">Pod without sidecar</text>
  <text x="295" y="408" font-size="12" text-anchor="middle" fill="#555">namespace plain, no identity</text>

  <!-- allowed arrows -->
  <line x1="150" y1="235" x2="213" y2="235" stroke="#d9730d" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="385" y1="235" x2="468" y2="235" stroke="#d9730d" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="640" y1="215" x2="898" y2="160" stroke="#d9730d" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="640" y1="255" x2="898" y2="266" stroke="#d9730d" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="1005" y1="300" x2="1005" y2="358" stroke="#d9730d" stroke-width="3" marker-end="url(#ao)"/>

  <!-- blocked arrows -->
  <path d="M1110 160 C1165 160 1165 266 1112 266" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <path d="M600 270 L600 392 L898 392" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <path d="M390 400 L520 400 L520 272" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ar)"/>

  <!-- numbers on allowed arrows -->
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="426" cy="235" r="12" fill="#d9730d"/><text x="426" y="240">1</text>
    <circle cx="770" cy="188" r="12" fill="#d9730d"/><text x="770" y="193">2</text>
    <circle cx="770" cy="261" r="12" fill="#d9730d"/><text x="770" y="266">3</text>
    <circle cx="1005" cy="320" r="12" fill="#d9730d"/><text x="1005" y="325">4</text>
  </g>

  <!-- crosses on blocked arrows -->
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="1148" cy="213" r="12" fill="#c0392b"/><text x="1148" y="218">x</text>
    <circle cx="750" cy="392" r="12" fill="#c0392b"/><text x="750" y="397">x</text>
    <circle cx="520" cy="336" r="12" fill="#c0392b"/><text x="520" y="341">x</text>
  </g>
  <text x="1005" y="215" font-size="12" text-anchor="middle" fill="#c0392b">details to reviews</text>
  <text x="750" y="424" font-size="12" text-anchor="middle" fill="#c0392b">productpage to ratings</text>

  <!-- legend: policies -->
  <line x1="30" y1="480" x2="1170" y2="480" stroke="#ccc" stroke-width="1"/>
  <g font-size="14" fill="#222">
    <circle cx="44" cy="508" r="11" fill="#d9730d"/><text x="44" y="513" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">1</text>
    <text x="66" y="513"><tspan font-weight="700">allow-productpage</tspan>: only the ingress gateway may call productpage, GET only</text>
    <circle cx="44" cy="538" r="11" fill="#d9730d"/><text x="44" y="543" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">2</text>
    <text x="66" y="543"><tspan font-weight="700">allow-details</tspan>: only productpage may call details</text>
    <circle cx="44" cy="568" r="11" fill="#d9730d"/><text x="44" y="573" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">3</text>
    <text x="66" y="573"><tspan font-weight="700">allow-reviews</tspan>: only productpage may call reviews</text>
    <circle cx="640" cy="538" r="11" fill="#d9730d"/><text x="640" y="543" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">4</text>
    <text x="662" y="543"><tspan font-weight="700">allow-ratings</tspan>: only reviews may call ratings</text>
    <circle cx="640" cy="568" r="11" fill="#c0392b"/><text x="640" y="573" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">x</text>
    <text x="662" y="573">dashed red: no policy allows it, answer is 403</text>
  </g>
</svg>
