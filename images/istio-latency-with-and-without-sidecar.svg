<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#d9730d"/></marker>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">How much time does a sidecar add to one call?</text>
  <text x="600" y="58" text-anchor="middle" fill="#555" font-size="13">Same client, same server, on two different nodes. Once without sidecars, once with a sidecar on each side.</text>

  <!-- variant 1 -->
  <text x="40" y="100" font-weight="bold" fill="#222" font-size="16">A. No mesh</text>
  <rect x="200" y="112" width="190" height="64" rx="8" fill="#f3f6fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="295" y="150" text-anchor="middle" fill="#222" font-weight="bold">client (fortio)</text>
  <rect x="760" y="112" width="190" height="64" rx="8" fill="#f3f6fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="855" y="150" text-anchor="middle" fill="#222" font-weight="bold">server (fortio)</text>
  <line x1="392" y1="144" x2="756" y2="144" stroke="#d9730d" stroke-width="3" marker-end="url(#arr)"/>
  <circle cx="574" cy="144" r="13" fill="#d9730d"/><text x="574" y="149" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
  <text x="574" y="130" text-anchor="middle" fill="#555" font-size="12">plain HTTP</text>
  <text x="975" y="150" fill="#222" font-size="16" font-weight="bold">median 0.72 ms</text>

  <!-- variant 2 -->
  <text x="40" y="238" font-weight="bold" fill="#222" font-size="16">B. With sidecars</text>
  <rect x="140" y="250" width="290" height="80" rx="8" fill="#f3f6fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="160" y="276" fill="#555" font-size="12">pod</text>
  <rect x="160" y="284" width="110" height="34" rx="5" fill="#ffffff" stroke="#4a6fa5"/><text x="215" y="306" text-anchor="middle" fill="#222">client</text>
  <rect x="300" y="284" width="110" height="34" rx="5" fill="#1a5fb4"/><text x="355" y="306" text-anchor="middle" fill="#fff">sidecar</text>
  <rect x="740" y="250" width="290" height="80" rx="8" fill="#f3f6fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="760" y="276" fill="#555" font-size="12">pod</text>
  <rect x="760" y="284" width="110" height="34" rx="5" fill="#1a5fb4"/><text x="815" y="306" text-anchor="middle" fill="#fff">sidecar</text>
  <rect x="900" y="284" width="110" height="34" rx="5" fill="#ffffff" stroke="#4a6fa5"/><text x="955" y="306" text-anchor="middle" fill="#222">server</text>
  <line x1="272" y1="301" x2="296" y2="301" stroke="#d9730d" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="412" y1="301" x2="756" y2="301" stroke="#d9730d" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="872" y1="301" x2="896" y2="301" stroke="#d9730d" stroke-width="3" marker-end="url(#arr)"/>
  <circle cx="284" cy="270" r="13" fill="#d9730d"/><text x="284" y="275" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
  <circle cx="584" cy="301" r="13" fill="#d9730d"/><text x="584" y="306" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
  <circle cx="884" cy="270" r="13" fill="#d9730d"/><text x="884" y="275" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
  <text x="584" y="284" text-anchor="middle" fill="#555" font-size="12">mTLS</text>
  <text x="1050" y="296" fill="#222" font-size="16" font-weight="bold">median 2.7 ms</text>

  <!-- legend -->
  <g fill="#333" font-size="13">
    <circle cx="60" cy="372" r="10" fill="#d9730d"/><text x="60" y="376" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text>
    <text x="80" y="377">Where the request goes, in order</text>
    <rect x="360" y="363" width="14" height="14" rx="2" fill="#1a5fb4"/><text x="382" y="376">Envoy sidecar (istio-proxy)</text>
    <text x="40" y="408" fill="#555">Numbers on the right: median (p50) in milliseconds, measured in our lab at 200 requests per second, 4 connections, 3 runs of 60 seconds.</text>
  </g>
</svg>
