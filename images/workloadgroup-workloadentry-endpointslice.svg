<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">WorkloadGroup, WorkloadEntry and EndpointSlice: who is who</text>

  <!-- istiod -->
  <rect x="960" y="70" width="200" height="500" rx="10" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="1060" y="104" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f5f1f">istiod</text>
  <text x="1060" y="128" text-anchor="middle" fill="#555" font-size="12">reads all three rows</text>
  <text x="1060" y="146" text-anchor="middle" fill="#555" font-size="12">and tells every sidecar:</text>
  <text x="1060" y="164" text-anchor="middle" fill="#555" font-size="12">"these are the addresses</text>
  <text x="1060" y="182" text-anchor="middle" fill="#555" font-size="12">behind this Service"</text>

  <!-- Row 1: pods -->
  <text x="60" y="88" font-weight="bold" fill="#1f5f1f">1  Pods (what you know)</text>
  <rect x="60" y="100" width="240" height="84" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="180" y="127" text-anchor="middle" font-weight="bold">Deployment</text>
  <text x="180" y="148" text-anchor="middle" fill="#555" font-size="12">the template</text>
  <text x="180" y="166" text-anchor="middle" fill="#555" font-size="12">describes the pods</text>
  <rect x="360" y="100" width="240" height="84" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="480" y="127" text-anchor="middle" font-weight="bold">Pod</text>
  <text x="480" y="148" text-anchor="middle" fill="#555" font-size="12">one instance, has an address</text>
  <text x="480" y="166" text-anchor="middle" fill="#555" font-size="12">created from the Deployment</text>
  <rect x="660" y="100" width="240" height="84" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="780" y="127" text-anchor="middle" font-weight="bold">EndpointSlice</text>
  <text x="780" y="148" text-anchor="middle" fill="#555" font-size="12">list of the pod addresses</text>
  <text x="780" y="166" text-anchor="middle" fill="#555" font-size="12">written by Kubernetes</text>
  <path d="M302,142 L358,142" stroke="#555" stroke-width="2" fill="none" marker-end="url(#pg)"/>
  <path d="M602,142 L658,142" stroke="#555" stroke-width="2" fill="none" marker-end="url(#pg)"/>
  <path d="M902,142 L958,142" stroke="#555" stroke-width="2" fill="none" marker-end="url(#pg)"/>

  <!-- Row 2: VM, the Istio way -->
  <text x="60" y="258" font-weight="bold" fill="#8a4500">2  VM, the Istio way</text>
  <rect x="60" y="270" width="240" height="84" rx="6" fill="#fff4e0" stroke="#d9730d" stroke-width="2"/>
  <text x="180" y="297" text-anchor="middle" font-weight="bold">WorkloadGroup</text>
  <text x="180" y="318" text-anchor="middle" fill="#555" font-size="12">the template for VMs: labels,</text>
  <text x="180" y="336" text-anchor="middle" fill="#555" font-size="12">service account, port, no address</text>
  <rect x="360" y="270" width="240" height="84" rx="6" fill="#fff4e0" stroke="#d9730d" stroke-width="2"/>
  <text x="480" y="297" text-anchor="middle" font-weight="bold">WorkloadEntry</text>
  <text x="480" y="318" text-anchor="middle" fill="#555" font-size="12">one VM, has an address; created</text>
  <text x="480" y="336" text-anchor="middle" fill="#555" font-size="12">by istiod when the VM connects</text>
  <rect x="660" y="314" width="240" height="40" rx="6" fill="#f2f2f2" stroke="#999" stroke-dasharray="6 4"/>
  <text x="780" y="338" text-anchor="middle" fill="#777" font-size="12">EndpointSlice of the Service: stays empty</text>
  <path d="M302,300 L358,300" stroke="#d9730d" stroke-width="2.5" fill="none" marker-end="url(#po)"/>
  <path d="M602,292 L958,292" stroke="#d9730d" stroke-width="2.5" fill="none" marker-end="url(#po)"/>
  <text x="780" y="284" text-anchor="middle" fill="#8a4500" font-size="12">istiod reads the WorkloadEntry directly</text>

  <!-- Row 3: VM by hand -->
  <text x="60" y="428" font-weight="bold" fill="#4b2a78">3  VM, by hand (plain Kubernetes)</text>
  <rect x="60" y="440" width="240" height="84" rx="6" fill="#f7f3fb" stroke="#7a4fb0" stroke-width="2"/>
  <text x="180" y="467" text-anchor="middle" font-weight="bold">Service without selector</text>
  <text x="180" y="488" text-anchor="middle" fill="#555" font-size="12">no label match, so Kubernetes</text>
  <text x="180" y="506" text-anchor="middle" fill="#555" font-size="12">adds no addresses itself</text>
  <rect x="360" y="440" width="240" height="84" rx="6" fill="#f7f3fb" stroke="#7a4fb0" stroke-width="2"/>
  <text x="480" y="467" text-anchor="middle" font-weight="bold">EndpointSlice</text>
  <text x="480" y="488" text-anchor="middle" fill="#555" font-size="12">written by you: the address</text>
  <text x="480" y="506" text-anchor="middle" fill="#555" font-size="12">of the VM, same name as the Service</text>
  <path d="M302,482 L358,482" stroke="#7a4fb0" stroke-width="2" fill="none"/>
  <path d="M602,462 L958,462" stroke="#7a4fb0" stroke-width="2.5" fill="none" marker-end="url(#pg)"/>
  <text x="780" y="454" text-anchor="middle" fill="#4b2a78" font-size="12">istiod reads the EndpointSlice</text>
  <text x="780" y="490" text-anchor="middle" fill="#4b2a78" font-size="12">No WorkloadEntry, nobody removes it,</text>
  <text x="780" y="508" text-anchor="middle" fill="#4b2a78" font-size="12">the call arrives without mTLS (lab test)</text>

  <!-- Legend -->
  <rect x="40" y="590" width="1120" height="150" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="56" y="616" font-weight="bold" fill="#333">How to read this</text>
  <text x="56" y="640" fill="#333"><tspan font-weight="bold">WorkloadGroup</tspan> is to VMs what a Deployment is to pods: the template. <tspan font-weight="bold">WorkloadEntry</tspan> is to a VM what a pod is to a Deployment: one instance with its address.</text>
  <text x="56" y="662" fill="#333">A Service finds a WorkloadEntry by label, like a pod (rows 1 and 2). Kubernetes knows nothing about WorkloadEntries, so the EndpointSlice of that Service stays empty.</text>
  <text x="56" y="684" fill="#333">Row 3 works, too: any address can sit behind a Service. But you write it, you remove it, and the client sidecar sends plain text to it instead of mTLS.</text>
  <text x="56" y="712" fill="#555" font-size="13">Orange: Istio objects. Green: Kubernetes objects. Purple: the manual way.</text>
</svg>
