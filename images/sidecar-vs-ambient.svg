  <text x="217" y="267" text-anchor="middle" font-weight="bold" fill="#fff" font-size="13">Envoy</text>
  <rect x="335" y="135" width="200" height="70" rx="8" fill="#e8f4f8" stroke="#4a6fa5" stroke-width="2"/>
