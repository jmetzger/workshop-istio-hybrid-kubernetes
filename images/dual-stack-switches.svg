<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">On the VM: which interfaces does the sidecar use, IPv4 and IPv6?</text>

  <!-- Cluster -->
  <rect x="40" y="60" width="360" height="260" rx="10" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="60" y="86" font-weight="bold" font-size="16" fill="#1f5f1f">Kubernetes cluster</text>
  <rect x="60" y="105" width="320" height="195" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="220" y="132" text-anchor="middle" font-weight="bold">istiod</text>
  <text x="220" y="156" text-anchor="middle" fill="#555" font-size="12">Precondition, set when the cluster is built:</text>
  <text x="220" y="176" text-anchor="middle" font-weight="bold" fill="#333">ISTIO_DUAL_STACK=true</text>
  <text x="220" y="200" text-anchor="middle" fill="#555" font-size="12">istiod then builds the Envoy listeners</text>
  <text x="220" y="218" text-anchor="middle" fill="#555" font-size="12">15001 and 15006 on 0.0.0.0 and [::].</text>
  <text x="220" y="242" text-anchor="middle" fill="#555" font-size="12">Without it Envoy listens on IPv4 only,</text>
  <text x="220" y="260" text-anchor="middle" fill="#555" font-size="12">whatever you set on the VM (measured).</text>

  <!-- VM -->
  <rect x="440" y="60" width="720" height="470" rx="10" fill="#eef4fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="460" y="86" font-weight="bold" font-size="16" fill="#1d3b66">Virtual machine: file /var/lib/istio/envoy/cluster.env</text>

  <!-- Column A -->
  <rect x="460" y="105" width="320" height="70" rx="6" fill="#fff4e0" stroke="#d9730d" stroke-width="2.5"/>
  <text x="620" y="132" text-anchor="middle" font-weight="bold" fill="#8a4500">DUAL_STACK='true'</text>
  <text x="620" y="154" text-anchor="middle" fill="#555" font-size="12">one line you add (our script does)</text>
  <path d="M620,176 L620,208" stroke="#555" stroke-width="2" fill="none" marker-end="url(#pg)"/>
  <rect x="460" y="210" width="320" height="270" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="620" y="236" text-anchor="middle" font-weight="bold">Only the iptables rules</text>
  <text x="620" y="262" text-anchor="middle" fill="#333" font-size="13">iptables and ip6tables rules:</text>
  <text x="620" y="280" text-anchor="middle" fill="#555" font-size="12">the traffic is redirected to Envoy</text>
  <text x="620" y="298" text-anchor="middle" fill="#555" font-size="12">for IPv4 and IPv6</text>
  <text x="620" y="330" text-anchor="middle" fill="#333" font-size="13">Ports of the sidecar itself:</text>
  <text x="620" y="352" text-anchor="middle" fill="#555" font-size="12">Envoy admin 15000: 127.0.0.1</text>
  <text x="620" y="370" text-anchor="middle" fill="#555" font-size="12">15021 and 15090: 0.0.0.0 only</text>
  <text x="620" y="400" text-anchor="middle" fill="#b00020" font-size="12">stay on IPv4</text>

  <!-- Column B -->
  <rect x="820" y="105" width="320" height="70" rx="6" fill="#fff4e0" stroke="#d9730d" stroke-width="2.5"/>
  <text x="980" y="132" text-anchor="middle" font-weight="bold" fill="#8a4500">ISTIO_DUAL_STACK='true'</text>
  <text x="980" y="154" text-anchor="middle" fill="#555" font-size="12">written by istioctl when the files are created</text>
  <path d="M980,176 L980,208" stroke="#555" stroke-width="2" fill="none" marker-end="url(#pg)"/>
  <rect x="820" y="210" width="320" height="270" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="980" y="236" text-anchor="middle" font-weight="bold">Rules and the sidecar ports</text>
  <text x="980" y="262" text-anchor="middle" fill="#333" font-size="13">iptables and ip6tables rules:</text>
  <text x="980" y="280" text-anchor="middle" fill="#555" font-size="12">the traffic is redirected to Envoy</text>
  <text x="980" y="298" text-anchor="middle" fill="#555" font-size="12">for IPv4 and IPv6 (same as DUAL_STACK)</text>
  <text x="980" y="330" text-anchor="middle" fill="#333" font-size="13">Ports of the sidecar itself:</text>
  <text x="980" y="352" text-anchor="middle" fill="#555" font-size="12">Envoy admin 15000: [::1] only</text>
  <text x="980" y="370" text-anchor="middle" fill="#555" font-size="12">15021 and 15090: 0.0.0.0 and [::]</text>
  <text x="980" y="400" text-anchor="middle" fill="#1f5f1f" font-size="12">move to IPv6</text>

  <!-- Both -->
  <text x="800" y="505" text-anchor="middle" fill="#333" font-size="13">Both lines together behave like ISTIO_DUAL_STACK alone. The DNS proxy (15053) stays on 127.0.0.1 in every case.</text>

  <!-- Legend -->
  <rect x="40" y="550" width="1120" height="190" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="56" y="576" font-weight="bold" fill="#333">Measured on the lab VM (IPv6 and private IPv4 address, istiod with ISTIO_DUAL_STACK=true, 3 calls per variant)</text>
  <text x="56" y="600" fill="#333"><tspan font-weight="bold">Neither variable:</tspan> 0 IPv6 rules, the call fails (503). <tspan font-weight="bold">DUAL_STACK:</tspan> 19 IPv6 rules, HTTP 200. <tspan font-weight="bold">ISTIO_DUAL_STACK:</tspan> 19 IPv6 rules, HTTP 200.</text>
  <text x="56" y="624" fill="#333">The call works with either name. The difference is on which interface the sidecar listens: only ISTIO_DUAL_STACK moves its own ports to IPv6.</text>
  <text x="56" y="648" fill="#333">Careful: with ISTIO_DUAL_STACK the Envoy admin port is on [::1] only. The health check of the agent asks 127.0.0.1:15000 and fails: the VM never gets healthy (measured).</text>
  <text x="56" y="672" fill="#333">The listeners 15001 and 15006 on [::] do not depend on the VM at all: they come from istiod (left box).</text>
  <text x="56" y="696" fill="#333">Why dual stack at all: the VM has an IPv6 address and a private IPv4 address (100.65.x.x, not routed). With two address families Istio uses the dual mode.</text>
  <text x="56" y="724" fill="#555" font-size="13">Orange: the lines you can have in cluster.env. Look at the real state with: ss -ltnp | grep -E ':150[0-9][0-9] '  and  ip6tables-save -t nat | grep -c ISTIO.</text>
</svg>
