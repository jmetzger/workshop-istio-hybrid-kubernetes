<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">The gateway pod: one pod, on one node (the scheduler decides)</text>

  <!-- Service -->
  <rect x="30" y="150" width="270" height="120" rx="8" fill="#fff4e0" stroke="#d9730d" stroke-width="2"/>
  <text x="165" y="180" text-anchor="middle" font-weight="bold" fill="#8a4500">Service istio-ingressgateway</text>
  <text x="165" y="204" text-anchor="middle" fill="#333" font-size="13">port 80 leads to port 8080</text>
  <text x="165" y="226" text-anchor="middle" fill="#555" font-size="12">a fixed address, it does not change</text>
  <text x="165" y="244" text-anchor="middle" fill="#555" font-size="12">when the pod moves to another node</text>

  <!-- Node cp -->
  <rect x="380" y="60" width="580" height="140" rx="8" fill="#f7f7f7" stroke="#888" stroke-width="2"/>
  <text x="400" y="86" font-weight="bold" fill="#333">Node a-cp (control plane)</text>
  <text x="400" y="106" fill="#666" font-size="12">no taint in our lab,</text>
  <text x="400" y="122" fill="#666" font-size="12">so a normal pod may run here</text>
  <rect x="620" y="90" width="320" height="90" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="780" y="120" text-anchor="middle" fill="#777" font-weight="bold">istio-ingressgateway pod</text>
  <text x="780" y="142" text-anchor="middle" fill="#777" font-size="13">would also be allowed here</text>
  <text x="780" y="162" text-anchor="middle" fill="#777" font-size="12">(not running here)</text>

  <!-- Node w1 -->
  <rect x="380" y="230" width="580" height="140" rx="8" fill="#f7f7f7" stroke="#888" stroke-width="2"/>
  <text x="400" y="256" font-weight="bold" fill="#333">Node a-w1 (worker)</text>
  <text x="400" y="276" fill="#666" font-size="12">in our lab the pod runs here</text>
  <rect x="620" y="260" width="320" height="90" rx="6" fill="#ffffff" stroke="#3b8a3b" stroke-width="2"/>
  <text x="780" y="290" text-anchor="middle" font-weight="bold">istio-ingressgateway pod (Envoy)</text>
  <text x="780" y="312" text-anchor="middle" fill="#333" font-size="13">listens on [::]:8080</text>
  <text x="780" y="332" text-anchor="middle" fill="#555" font-size="12">replicas: 1, so there is exactly one</text>

  <!-- arrow -->
  <path d="M300,225 L330,225 L330,305 L618,305" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <text x="500" y="328" text-anchor="middle" fill="#8a4500" font-size="12">the Service finds the pod,</text>
  <text x="500" y="344" text-anchor="middle" fill="#8a4500" font-size="12">wherever it runs</text>

  <!-- note -->
  <rect x="30" y="395" width="930" height="55" rx="6" fill="#e8f0fe" stroke="#4a6fa5"/>
  <text x="495" y="418" text-anchor="middle" fill="#1d3b66" font-size="13">"any node" means: no rule pins the pod to a node, so the scheduler picks one when the pod starts.</text>
  <text x="495" y="438" text-anchor="middle" fill="#1d3b66" font-size="13">It does not mean the pod runs on every node. Which node it is: <tspan font-family="monospace">kubectl get pod -n istio-ingress -o wide</tspan></text>
</svg>
