<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker>
  </defs>
  <rect width="1200" height="690" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">A virtual machine joins the mesh and answers like a pod</text>

  <!-- Cluster -->
  <rect x="40" y="60" width="600" height="390" rx="10" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="60" y="86" font-weight="bold" font-size="16" fill="#1f5f1f">Kubernetes cluster</text>

  <rect x="60" y="105" width="260" height="60" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="190" y="130" text-anchor="middle" font-weight="bold">Service diameter-adapter</text>
  <text x="190" y="151" text-anchor="middle" fill="#555" font-size="12">a name for the VM, no pods behind it</text>

  <path d="M190,165 L190,208" stroke="#555" stroke-width="1.5" fill="none"/>
  <text x="200" y="192" fill="#555" font-size="12">same label: app=diameter-adapter</text>

  <rect x="60" y="210" width="260" height="80" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="190" y="238" text-anchor="middle" font-weight="bold">WorkloadEntry</text>
  <text x="190" y="259" text-anchor="middle" fill="#555" font-size="12">created by istiod, automatically</text>
  <text x="190" y="277" text-anchor="middle" fill="#555" font-size="12">holds the IPv6 address of the VM</text>

  <rect x="380" y="210" width="240" height="80" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="500" y="244" text-anchor="middle" font-weight="bold">istiod</text>
  <text x="500" y="266" text-anchor="middle" fill="#555" font-size="12">the control plane of the mesh</text>

  <path d="M378,250 L322,250" stroke="#555" stroke-width="2" fill="none" marker-end="url(#pg)"/>
  <circle cx="350" cy="228" r="11" fill="#555"/><text x="350" y="233" text-anchor="middle" fill="#fff" font-weight="bold">2</text>

  <rect x="60" y="350" width="260" height="80" rx="6" fill="#fff" stroke="#3b8a3b"/>
  <text x="190" y="378" text-anchor="middle" font-weight="bold">Pod: client</text>
  <text x="190" y="399" text-anchor="middle" fill="#555" font-size="12">application + sidecar</text>
  <text x="190" y="417" text-anchor="middle" fill="#555" font-size="12">(a pod like any other)</text>

  <path d="M440,292 L290,348" stroke="#555" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#pg)"/>
  <circle cx="380" cy="324" r="11" fill="#555"/><text x="380" y="329" text-anchor="middle" fill="#fff" font-weight="bold">3</text>

  <!-- VM -->
  <rect x="800" y="60" width="360" height="390" rx="10" fill="#eef4fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="820" y="86" font-weight="bold" font-size="16" fill="#1d3b66">Virtual machine</text>
  <text x="1140" y="86" text-anchor="end" fill="#555" font-size="12">Ubuntu, IPv6 only</text>

  <rect x="820" y="105" width="320" height="90" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="980" y="138" text-anchor="middle" font-weight="bold">Your application</text>
  <text x="980" y="160" text-anchor="middle" fill="#555" font-size="12">Python echo server</text>
  <text x="980" y="178" text-anchor="middle" fill="#555" font-size="12">listens on port 8000</text>

  <rect x="820" y="230" width="320" height="200" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="980" y="256" text-anchor="middle" font-weight="bold">Istio sidecar</text>
  <text x="980" y="277" text-anchor="middle" fill="#555" font-size="12">pilot-agent + Envoy (package istio-sidecar.deb)</text>
  <text x="980" y="312" text-anchor="middle" font-size="13">Files from the bastion, copied once:</text>
  <text x="980" y="332" text-anchor="middle" fill="#555" font-size="12">root-cert.pem, istio-token,</text>
  <text x="980" y="350" text-anchor="middle" fill="#555" font-size="12">cluster.env, mesh.yaml</text>
  <text x="980" y="392" text-anchor="middle" font-size="13">Envoy takes over all traffic</text>
  <text x="980" y="410" text-anchor="middle" font-size="13">in and out of the VM</text>

  <!-- 1: VM sidecar connects to istiod -->
  <path d="M818,262 L622,262" stroke="#555" stroke-width="2" fill="none" marker-end="url(#pg)"/>
  <circle cx="720" cy="244" r="11" fill="#555"/><text x="720" y="249" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
  <text x="720" y="285" text-anchor="middle" fill="#555" font-size="12">connects to istiod</text>
  <text x="720" y="301" text-anchor="middle" fill="#555" font-size="12">(port 15012)</text>

  <!-- Request path -->
  <path d="M322,395 L818,395" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <circle cx="570" cy="372" r="12" fill="#d9730d"/><text x="570" y="377" text-anchor="middle" fill="#fff" font-weight="bold">A</text>
  <text x="570" y="420" text-anchor="middle" fill="#8a4500" font-size="12">mTLS over IPv6, straight to the VM</text>
  <path d="M980,228 L980,197" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#po)"/>
  <circle cx="1010" cy="213" r="12" fill="#d9730d"/><text x="1010" y="218" text-anchor="middle" fill="#fff" font-weight="bold">B</text>

  <!-- Legend -->
  <rect x="40" y="470" width="1120" height="205" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="56" y="496" font-weight="bold" fill="#333">How the VM joins the mesh (grey numbers)</text>
  <text x="56" y="518" fill="#333"><tspan font-weight="bold">1</tspan>  The sidecar on the VM connects to istiod with the token and the root certificate and says: "I am diameter-adapter". It gets a workload certificate, like a pod.</text>
  <text x="56" y="538" fill="#333"><tspan font-weight="bold">2</tspan>  istiod creates a WorkloadEntry with the IPv6 address of the VM. Its label matches the Service, so the Service now has an endpoint: the VM.</text>
  <text x="56" y="558" fill="#333"><tspan font-weight="bold">3</tspan>  istiod tells all sidecars in the mesh: diameter-adapter lives at this address.</text>
  <text x="56" y="594" font-weight="bold" fill="#8a4500">The path of a request (orange)</text>
  <text x="56" y="616" fill="#333"><tspan font-weight="bold">A</tspan>  The client pod calls diameter-adapter. Its sidecar sends the request over mTLS straight to the VM, as it would to any pod.</text>
  <text x="56" y="636" fill="#333"><tspan font-weight="bold">B</tspan>  The sidecar on the VM decrypts it and hands it to the application on port 8000. The answer takes the same way back.</text>
  <text x="56" y="660" fill="#555" font-size="13">For the mesh the VM is just another workload: same certificates, same mTLS, same Service name.</text>
</svg>
