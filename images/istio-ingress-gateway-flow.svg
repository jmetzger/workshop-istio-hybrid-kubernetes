<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Istio ingress gateway: Gateway, VirtualService and DestinationRule</text>

  <rect x="20" y="170" width="140" height="64" rx="6" fill="#ece9fb" stroke="#7a6fd0" stroke-width="2"/>
  <text x="90" y="198" text-anchor="middle" font-weight="bold" fill="#3a3180">Client</text>
  <text x="90" y="217" text-anchor="middle" fill="#3a3180" font-size="12">browser, curl</text>
  <path d="M162,202 L218,202" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#ao)"/>
  <text x="190" y="192" text-anchor="middle" fill="#8a4500" font-size="11">HTTP(S)</text>

  <rect x="220" y="160" width="200" height="84" rx="6" fill="#e1f5ff" stroke="#2a7fb0" stroke-width="2"/>
  <text x="320" y="188" text-anchor="middle" font-weight="bold" fill="#14506f">Ingress gateway</text>
  <text x="320" y="208" text-anchor="middle" fill="#14506f" font-size="12">Pod istio-ingressgateway</text>
  <text x="320" y="226" text-anchor="middle" fill="#14506f" font-size="12">(an Envoy, no application)</text>

  <!-- Gateway object -->
  <rect x="220" y="330" width="200" height="84" rx="6" fill="#fff3cd" stroke="#b58900" stroke-width="2"/>
  <text x="320" y="358" text-anchor="middle" font-weight="bold" fill="#6b5200">Gateway</text>
  <text x="320" y="378" text-anchor="middle" fill="#6b5200" font-size="12">networking.istio.io</text>
  <text x="320" y="396" text-anchor="middle" fill="#6b5200" font-size="12">ports, hosts, TLS</text>
  <path d="M320,328 L320,246" stroke="#555" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)"/>
  <text x="332" y="294" fill="#555" font-size="12">selector picks the</text>
  <text x="332" y="310" fill="#555" font-size="12">gateway pod</text>

  <!-- VirtualService -->
  <rect x="500" y="160" width="210" height="84" rx="6" fill="#fff3cd" stroke="#b58900" stroke-width="2"/>
  <text x="605" y="188" text-anchor="middle" font-weight="bold" fill="#6b5200">VirtualService</text>
  <text x="605" y="208" text-anchor="middle" fill="#6b5200" font-size="12">routing rules</text>
  <text x="605" y="226" text-anchor="middle" fill="#6b5200" font-size="12">gateways: [ the Gateway ]</text>
  <path d="M422,202 L498,202" stroke="#555" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="460" y="192" text-anchor="middle" fill="#555" font-size="11">routes</text>
  <path d="M580,246 L540,372 L422,372" stroke="#555" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)"/>
  <text x="520" y="396" fill="#555" font-size="12">VirtualService names the Gateway</text>

  <!-- route box -->
  <rect x="790" y="150" width="190" height="104" rx="6" fill="#f1eee4" stroke="#8a8670" stroke-width="2"/>
  <text x="885" y="176" text-anchor="middle" fill="#444" font-size="12">route: host web</text>
  <text x="885" y="196" text-anchor="middle" fill="#444" font-size="12">subset v1, weight 80</text>
  <text x="885" y="216" text-anchor="middle" fill="#444" font-size="12">route: host web</text>
  <text x="885" y="236" text-anchor="middle" fill="#444" font-size="12">subset v2, weight 20</text>
  <path d="M712,202 L788,202" stroke="#555" stroke-width="2" fill="none" marker-end="url(#ag)"/>

  <!-- DestinationRule -->
  <rect x="790" y="300" width="190" height="84" rx="6" fill="#fbe9e7" stroke="#bf5b4b" stroke-width="2"/>
  <text x="885" y="328" text-anchor="middle" font-weight="bold" fill="#7a2c20">DestinationRule web</text>
  <text x="885" y="348" text-anchor="middle" fill="#7a2c20" font-size="12">defines the subsets</text>
  <text x="885" y="366" text-anchor="middle" fill="#7a2c20" font-size="12">v1, v2 by pod label</text>
  <path d="M885,256 L885,298" stroke="#555" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)"/>
  <text x="897" y="282" fill="#555" font-size="12">subsets</text>

  <!-- pods -->
  <rect x="1040" y="130" width="150" height="60" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="1115" y="156" text-anchor="middle" font-weight="bold" fill="#0b5247">web v1</text>
  <text x="1115" y="175" text-anchor="middle" fill="#0b5247" font-size="10.5">version=v1, gets 80 %</text>
  <rect x="1040" y="230" width="150" height="60" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="1115" y="256" text-anchor="middle" font-weight="bold" fill="#0b5247">web v2</text>
  <text x="1115" y="275" text-anchor="middle" fill="#0b5247" font-size="10.5">version=v2, gets 20 %</text>
  <path d="M982,185 L1038,162" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#ao)"/>
  <path d="M982,225 L1038,255" stroke="#d9730d" stroke-width="3" fill="none" marker-end="url(#ao)"/>
  
  

  <text x="600" y="480" text-anchor="middle" fill="#555" font-size="13">The Gateway only opens the door (port, host, TLS). Where the traffic goes is decided in the VirtualService, the subsets come from the DestinationRule.</text>
  <text x="600" y="502" text-anchor="middle" fill="#555" font-size="13">Three Istio objects, plus the gateway pod that has to exist already.</text>
</svg>
