<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">No mesh, sidecar, ambient: what others measured</text>

  <!-- Panel A: requests per second, x = 150 + v * 1.6 (0..160) -->
  <rect x="20" y="56" width="440" height="300" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <text x="40" y="84" font-weight="bold" fill="#222">Requests per second, same load test</text>
  <text x="40" y="104" font-size="12" fill="#555">LiveWyer, Istio 1.22, Bookinfo, 32 connections</text>
  <g text-anchor="end" fill="#222"><text x="140" y="151">no mesh</text><text x="140" y="211">ambient</text><text x="140" y="271">sidecar</text></g>
  <path d="M150,130 h226.1 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-226.1 z" fill="#8a8a8a"/>
  <path d="M150,190 h205.1 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-205.1 z" fill="#7a4fa5"/>
  <path d="M150,250 h195.2 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-195.2 z" fill="#1a5fb4"/>
  <g fill="#222" font-weight="bold"><text x="390" y="151">144</text><text x="369" y="211">131</text><text x="359" y="271">125</text></g>
  <g fill="#555" font-size="12"><text x="150" y="182">baseline</text><text x="150" y="242">9 percent fewer</text><text x="150" y="302">13 percent fewer</text></g>
  <text x="40" y="338" font-size="12" fill="#555">more is better</text>

  <!-- Panel B: CPU per proxy, x = 600 + v * 600 (0..0.3) -->
  <rect x="480" y="56" width="340" height="300" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <text x="500" y="84" font-weight="bold" fill="#222">CPU of one proxy (vCPU)</text>
  <text x="500" y="104" font-size="12" fill="#555">Istio project, Istio 1.24, 1000 requests per second</text>
  <g text-anchor="end" fill="#222"><text x="590" y="151">sidecar</text><text x="590" y="211">waypoint</text><text x="590" y="271">ztunnel</text></g>
  <path d="M600,130 h116 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-116 z" fill="#1a5fb4"/>
  <path d="M600,190 h146 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-146 z" fill="#7a4fa5"/>
  <path d="M600,250 h32 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-32 z" fill="#7a4fa5"/>
  <g fill="#222" font-weight="bold"><text x="730" y="151">0.20</text><text x="760" y="211">0.25</text><text x="646" y="271">0.06</text></g>
  <text x="500" y="338" font-size="12" fill="#555">less is better</text>

  <!-- Panel C: memory per proxy, x = 960 + v * 2.4 (0..70) -->
  <rect x="840" y="56" width="340" height="300" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <text x="860" y="84" font-weight="bold" fill="#222">Memory of one proxy (MB)</text>
  <text x="860" y="104" font-size="12" fill="#555">Istio project, Istio 1.24, 1000 requests per second</text>
  <g text-anchor="end" fill="#222"><text x="950" y="151">sidecar</text><text x="950" y="211">waypoint</text><text x="950" y="271">ztunnel</text></g>
  <path d="M960,130 h140 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-140 z" fill="#1a5fb4"/>
  <path d="M960,190 h140 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-140 z" fill="#7a4fa5"/>
  <path d="M960,250 h24.8 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-24.8 z" fill="#7a4fa5"/>
  <g fill="#222" font-weight="bold"><text x="1114" y="151">60</text><text x="1114" y="211">60</text><text x="999" y="271">12</text></g>
  <text x="860" y="338" font-size="12" fill="#555">less is better</text>

  <rect x="300" y="376" width="14" height="14" rx="2" fill="#8a8a8a"/><text x="322" y="388" fill="#333" font-size="13">no mesh</text>
  <rect x="420" y="376" width="14" height="14" rx="2" fill="#1a5fb4"/><text x="442" y="388" fill="#333" font-size="13">sidecar mode (one proxy per pod)</text>
  <rect x="690" y="376" width="14" height="14" rx="2" fill="#7a4fa5"/><text x="712" y="388" fill="#333" font-size="13">ambient mode (ztunnel per node, waypoint for layer 7)</text>
</svg>
