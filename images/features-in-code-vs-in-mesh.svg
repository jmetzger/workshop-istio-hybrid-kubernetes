<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Where the network features live: in every service, or once in the mesh</text>

  <!-- Left -->
  <rect x="30" y="55" width="560" height="395" rx="10" fill="#fff8f8" stroke="#c0504d" stroke-width="2"/>
  <text x="310" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a2a2a">Problem: every service implements it itself</text>

  <rect x="60" y="120" width="150" height="56" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="135" y="153" text-anchor="middle" font-weight="bold" fill="#0b5247">Service (Java)</text>
  <rect x="60" y="226" width="150" height="56" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="135" y="259" text-anchor="middle" font-weight="bold" fill="#0b5247">Service (Go)</text>
  <rect x="60" y="332" width="150" height="56" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="135" y="365" text-anchor="middle" font-weight="bold" fill="#0b5247">Service (Python)</text>

  <path d="M212,148 L298,148" stroke="#777" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M212,254 L298,254" stroke="#777" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M212,360 L298,360" stroke="#777" stroke-width="2" marker-end="url(#ag)"/>
  <text x="255" y="140" text-anchor="middle" fill="#555" font-size="11">implements</text>
  <text x="255" y="246" text-anchor="middle" fill="#555" font-size="11">implements</text>
  <text x="255" y="352" text-anchor="middle" fill="#555" font-size="11">implements</text>

  <rect x="300" y="110" width="260" height="76" rx="6" fill="#ffd9d6" stroke="#c0504d" stroke-width="2"/>
  <text x="430" y="136" text-anchor="middle" fill="#6b1a17" font-weight="bold" font-size="13">Load balancing, retries,</text>
  <text x="430" y="156" text-anchor="middle" fill="#6b1a17" font-weight="bold" font-size="13">mTLS, tracing</text>
  <text x="430" y="176" text-anchor="middle" fill="#6b1a17" font-size="12">written in Java</text>
  <rect x="300" y="216" width="260" height="76" rx="6" fill="#ffd9d6" stroke="#c0504d" stroke-width="2"/>
  <text x="430" y="242" text-anchor="middle" fill="#6b1a17" font-weight="bold" font-size="13">Load balancing, retries,</text>
  <text x="430" y="262" text-anchor="middle" fill="#6b1a17" font-weight="bold" font-size="13">mTLS, tracing</text>
  <text x="430" y="282" text-anchor="middle" fill="#6b1a17" font-size="12">written again in Go</text>
  <rect x="300" y="322" width="260" height="76" rx="6" fill="#ffd9d6" stroke="#c0504d" stroke-width="2"/>
  <text x="430" y="348" text-anchor="middle" fill="#6b1a17" font-weight="bold" font-size="13">Load balancing, retries,</text>
  <text x="430" y="368" text-anchor="middle" fill="#6b1a17" font-weight="bold" font-size="13">mTLS, tracing</text>
  <text x="430" y="388" text-anchor="middle" fill="#6b1a17" font-size="12">written again in Python</text>
  <text x="310" y="430" text-anchor="middle" fill="#8a2a2a" font-size="12">Three languages, three implementations, three behaviours</text>

  <!-- Right -->
  <rect x="610" y="55" width="560" height="395" rx="10" fill="#f3faf3" stroke="#3b8a3b" stroke-width="2"/>
  <text x="890" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f5f1f">Solution: the service mesh does it</text>

  <rect x="640" y="120" width="150" height="56" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="715" y="153" text-anchor="middle" font-weight="bold" fill="#0b5247">Service (Java)</text>
  <rect x="640" y="226" width="150" height="56" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="715" y="259" text-anchor="middle" font-weight="bold" fill="#0b5247">Service (Go)</text>
  <rect x="640" y="332" width="150" height="56" rx="6" fill="#e0f2f1" stroke="#0f7b6c" stroke-width="2"/>
  <text x="715" y="365" text-anchor="middle" font-weight="bold" fill="#0b5247">Service (Python)</text>

  <path d="M792,148 L888,230" stroke="#777" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M792,254 L888,254" stroke="#777" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M792,360 L888,278" stroke="#777" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="890" y="150" width="260" height="210" rx="8" fill="#d4edda" stroke="#3b8a3b" stroke-width="2"/>
  <text x="1020" y="184" text-anchor="middle" fill="#1f5f1f" font-weight="bold" font-size="16">Service mesh</text>
  <text x="1020" y="206" text-anchor="middle" fill="#1f5f1f" font-size="12">(Envoy sidecars + istiod)</text>
  <text x="1020" y="242" text-anchor="middle" fill="#1f5f1f" font-size="13">Load balancing</text>
  <text x="1020" y="264" text-anchor="middle" fill="#1f5f1f" font-size="13">Retries and timeouts</text>
  <text x="1020" y="286" text-anchor="middle" fill="#1f5f1f" font-size="13">mTLS and security policy</text>
  <text x="1020" y="308" text-anchor="middle" fill="#1f5f1f" font-size="13">Tracing and metrics</text>
  <text x="1020" y="330" text-anchor="middle" fill="#1f5f1f" font-size="13">Observability</text>
  <text x="890" y="430" text-anchor="middle" fill="#1f5f1f" font-size="12">Configured once, the same for every language</text>
</svg>
